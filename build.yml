name: Build Cute Pigeons

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Clean and build
        run: gradle clean build --no-daemon

      - name: Verify generated JAR
        shell: bash
        run: |
          set -euo pipefail
          echo "=== build/libs ==="
          ls -lah build/libs

          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)"

          if [ -z "$JAR" ]; then
            echo "::error::No se ha generado ningún JAR del mod."
            exit 1
          fi

          SIZE=$(stat -c%s "$JAR")
          echo "JAR: $JAR"
          echo "SIZE: $SIZE bytes"

          if [ "$SIZE" -lt 10000 ]; then
            echo "::error::El JAR pesa menos de 10 KB; probablemente está vacío."
            exit 1
          fi

          echo "=== contenido del JAR ==="
          jar tf "$JAR" | head -80

          if ! jar tf "$JAR" | grep -q 'com/cutepigeons/CutePigeons.class'; then
            echo "::error::Falta CutePigeons.class dentro del JAR."
            exit 1
          fi

          if ! jar tf "$JAR" | grep -q 'com/cutepigeons/entity/CutePigeonEntity.class'; then
            echo "::error::Falta CutePigeonEntity.class dentro del JAR."
            exit 1
          fi

          if ! jar tf "$JAR" | grep -q 'META-INF/mods.toml'; then
            echo "::error::Falta META-INF/mods.toml dentro del JAR."
            exit 1
          fi

          echo "JAR VALIDADO CORRECTAMENTE: $JAR"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: cute-pigeons
          path: build/libs/*.jar
          if-no-files-found: error
